<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DALIL — دليل | Find the Jordan that feels like yours</title>
  <meta name="description" content="Dalil turns your time, mood and budget into a personalized route built around the Jordan you actually want to experience. Complete travel guide to Petra, Wadi Rum, Dead Sea, Jerash and hidden gems.">
  
  <!-- Google Fonts: Inter, IBM Plex Sans Arabic & Open Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Leaflet Interactive Maps -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation Header -->
  <header class="nav" id="mainNav">
    <a class="logo" href="#/">
      <span class="mark">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12c3-4 6 4 10 0s7 4 10 0" />
        </svg>
      </span>
      <div class="logo-text">
        <span class="logo-en">DALIL</span>
        <span class="logo-ar" data-i="logoAr">دليل</span>
      </div>
    </a>
    
    <nav class="nav-links" id="links"></nav>
    
    <div class="nav-actions">
      <button class="nav-btn icon-btn" id="searchNavBtn" aria-label="Search" title="Search">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
      <button class="nav-btn lang-btn" id="lang" aria-label="Switch Language">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
        <span id="langT">EN / AR</span>
      </button>
      <button class="pill pill-dark auth-btn" id="auth"></button>
    </div>
  </header>

  <!-- Main View Router Container -->
  <main id="app"></main>

  <!-- Mobile Bottom Tabbar -->
  <nav class="tabbar" id="tabs"></nav>

  <!-- Auth Dialog Modal with Google Sign-in -->
  <dialog id="dlg" class="modal-dialog">
    <div class="dialog-card">
      <div class="dialog-header">
        <h3 id="dT">Sign in</h3>
        <button type="button" class="close-btn" id="closeDlg" aria-label="Close">✕</button>
      </div>
      <p class="dialog-sub" id="dSub">Access your saved routes, customized trips and Jordan Passport stamps.</p>

      <!-- Google Sign In Button -->
      <button type="button" class="google-auth-btn" id="googleAuth">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span id="googleAuthText">Continue with Google</span>
      </button>

      <div class="auth-separator">
        <span id="orText">or with email</span>
      </div>

      <form id="authForm" onsubmit="return false;">
        <div class="form-group">
          <label for="em" class="field-label" id="emLabel">Email</label>
          <input id="em" class="form-input" type="email" placeholder="mohammed@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="pw" class="field-label" id="pwLabel">Password</label>
          <input id="pw" class="form-input" type="password" placeholder="•••••••• (6+ characters)" required autocomplete="current-password">
        </div>
        <p id="er" class="form-error"></p>
        <div class="dialog-actions">
          <button type="button" class="pill pill-clay" id="go">Sign in</button>
          <button type="button" class="pill pill-sand" id="reg">Create account</button>
        </div>
      </form>
    </div>
  </dialog>

  <!-- Toast Notification -->
  <div id="toast" class="toast-popup"></div>

  <!-- Scripts -->
  <script src="js/app.js" defer></script>
</body>
</html>
